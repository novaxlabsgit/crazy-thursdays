<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0818">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crazy Thursdays Club</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 620px at 50% 0%,#2a1757 0%,#0c0818 62%) #0c0818 fixed;color:#f1ecff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(26px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.top b{display:block;font-weight:800;letter-spacing:2.5px;font-size:14px}
.top small{display:block;font-weight:500;letter-spacing:3px;font-size:10px;color:#f4c95d;text-transform:uppercase;margin-top:2px}
.langs{display:flex;gap:4px;flex:none}
.langs button{font:600 12px inherit;font-family:inherit;color:#a79cc9;background:transparent;border:1px solid #32275a;border-radius:8px;padding:6px 9px;cursor:pointer}
.langs button.on{color:#fff;background:#5b3dff;border-color:transparent}
section{margin:0 0 22px}
h2{margin:0 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#a79cc9;font-weight:700}
.panel{background:rgba(21,16,38,.86);border:1px solid #32275a;border-radius:16px;padding:16px}
#stage{perspective:1400px}
#card{position:relative;width:100%;aspect-ratio:85/55;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.3,1);cursor:pointer}
#card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:3.53% / 5.45%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 16px 44px rgba(0,0,0,.65);background:#16102a}
.face.back{transform:rotateY(180deg)}
.face canvas{display:block;width:100%;height:100%}
.face.front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);background-size:300% 100%;animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
@media (prefers-reduced-motion:reduce){.face.front::after{animation:none;opacity:0}#card{transition:none}}
#who{margin:14px 0 0;font-weight:700;font-size:17px;text-align:center}
#tip{margin:2px 0 0;color:#a79cc9;font-size:13px;text-align:center}
#introText{margin:0;white-space:pre-wrap;color:#ddd5f5}
.ev{display:flex;gap:14px;align-items:flex-start}
.ev + .ev{margin-top:14px;padding-top:14px;border-top:1px solid #32275a}
.date{flex:none;width:64px;text-align:center;border:1px solid #32275a;border-radius:12px;padding:7px 0;background:#1f1736}
.date b{display:block;font-size:24px;line-height:1.1}
.date small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#a79cc9}
.ev.up .date{border-color:#f4c95d}.ev.up .date b{color:#f4c95d}
.ev .info{min-width:0;flex:1}
.ev h3{margin:0 0 3px;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.ev p{margin:2px 0;color:#c9c0e6;font-size:14.5px;overflow-wrap:anywhere}
.ev .desc{white-space:pre-wrap;margin-top:8px;color:#ddd5f5}
.hero{border-color:#f4c95d;background:linear-gradient(160deg,rgba(60,36,10,.5),rgba(21,16,38,.9))}
.hero h3{font-size:22px}
.count{display:inline-block;margin:0 0 8px;background:#f4c95d;color:#2a1c00;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;border-radius:99px;padding:4px 11px}
a.btn{display:inline-block;margin-top:10px;color:#fff;background:linear-gradient(135deg,#a53dff,#5b3dff);text-decoration:none;font-weight:600;font-size:14px;border-radius:10px;padding:8px 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:rgba(21,16,38,.86);border:1px solid #32275a;border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.1;color:#35e0d0}
.stat span{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#a79cc9}
.globe{height:min(92vw,520px)}
.globe canvas{display:block;width:100%;height:100%}
.hint{color:#a79cc9;font-size:13px;margin:6px 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#1f1736;border:1px solid #32275a;border-radius:99px;padding:4px 11px;font-size:13px}
.tag b{color:#ff8fe9;margin-left:5px}
footer{text-align:center;color:#6f6790;font-size:12px;padding-top:6px}
[hidden]{display:none !important}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><b>CRAZY THURSDAYS CLUB</b><small data-t="site.sub"></small></div>
    <div class="langs"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="nb">NO</button></div>
  </div>
  <section id="cardSec" hidden>
    <h2 data-t="site.card"></h2>
    <div id="stage"><div id="card" role="button"><div class="face front" id="fa"></div><div class="face back" id="fr"></div></div></div>
    <p id="who"></p><p id="tip" data-t="site.tap"></p>
  </section>
  <section id="introSec" hidden><div class="panel"><p id="introText"></p></div></section>
  <section id="nextSec"><h2 data-t="site.next"></h2><div class="panel hero" id="nextBox"></div></section>
  <section id="statSec" hidden><div class="stats" id="stats"></div></section>
  <section id="mapSec" hidden>
    <h2 data-t="site.map"></h2>
    <div class="panel"><div class="globe"><canvas id="globe"></canvas></div><p class="hint" data-t="site.mapHint"></p><h2 data-t="site.from" id="fromH"></h2><div class="tags" id="places"></div></div>
  </section>
  <section id="upSec" hidden><h2 data-t="site.upcoming"></h2><div class="panel" id="upList"></div></section>
  <section id="pastSec" hidden><h2 data-t="site.past"></h2><div class="panel" id="pastList"></div></section>
  <footer data-t="site.footer"></footer>
</div>

/* ---------- color y utilidades ---------- */
function hexRgb(h){ h = h.replace('#',''); if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h, a){ const c = hexRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(+a.toFixed(3))+')'; }
function mix(a, b, t){ const A = hexRgb(a), B = hexRgb(b); return '#'+A.map((v,i) => Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function lum(h){ const c = hexRgb(h); return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rr(ctx,x,y,w,h,r){ r = Math.min(r, w/2, h/2); const P = Math.PI; ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arc(x+w-r,y+r,r,-P/2,0); ctx.lineTo(x+w,y+h-r); ctx.arc(x+w-r,y+h-r,r,0,P/2); ctx.lineTo(x+r,y+h); ctx.arc(x+r,y+h-r,r,P/2,P); ctx.lineTo(x,y+r); ctx.arc(x+r,y+r,r,P,P*1.5); ctx.closePath(); }
function circle(ctx,x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); }

function fixHex(c){ if (typeof c !== 'string') return c; const s = c.trim(); return /^#[0-9a-f]{3}$/i.test(s) ? '#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3] : s.toLowerCase(); }

    x.save(); x.strokeStyle = 'rgba('+cyan+',.8)'; x.lineWidth = 1.2; x.shadowColor = 'rgba('+cyan+',.9)'; x.shadowBlur = 14; x.beginPath(); x.arc(cx,cy,R,0,TAU); x.stroke(); x.restore();

      const lg = x.createLinearGradient(a.x,a.y,b.x,b.y); lg.addColorStop(0,'rgba(255,70,220,.15)'); lg.addColorStop(1,'rgba(255,90,230,1)');

    }
  }

<script>
'use strict';
(function(){
  const $ = id => document.getElementById(id);
  let data = null, globe = null;
  // idioma: el guardado, o el del móvil
  let lang = null; try{ lang = localStorage.getItem('ctc-lang'); }catch(e){}
  if (!LANGS.includes(lang)){ const n = (navigator.language || 'en').toLowerCase(); lang = /^(nb|no|nn)/.test(n) ? 'nb' : /^(es|ca|gl|eu)/.test(n) ? 'es' : 'en'; }
  setLang(lang);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const localDate = s => { const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
  const isPast = e => !!e.date && e.date < todayStr();
  const country = cc => { try{ return new Intl.DisplayNames([LOCALE], {type:'region'}).of(cc) || cc; }catch(e){ return cc; } };
  const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';

  // carnet del QR: se dibuja con los datos del propio enlace, aunque no haya conexión con data.json
  let cardData = null; try{ cardData = decodeCard(location.hash); }catch(e){}
  function drawCard(){
    if (!cardData) return;
    const S = (window.devicePixelRatio || 1) > 1.5 ? 2 : 1.5;
    try{ for (const [box, side] of [[$('fa'),'front'],[$('fr'),'back']]){ const c = document.createElement('canvas'); renderToCanvas(c, side, cardData.card, cardData.design, {S, qr:location.href}); box.textContent = ''; box.appendChild(c); } }catch(e){ return; }
    $('who').textContent = (cardData.card.name || '').trim() + (cardData.card.no ? '  ·  Nº ' + cardData.card.no : ''); $('cardSec').hidden = false;
  }
  $('card').addEventListener('click', () => $('card').classList.toggle('flip'));
  window.addEventListener('hashchange', () => location.reload());

  function evNode(e, hero){
    const box = el('div', 'ev' + (isPast(e) ? '' : ' up')), d = el('div', 'date'), info = el('div', 'info');
    if (e.date){ const dt = localDate(e.date); d.append(el('b', '', dt.getDate()), el('small', '', dt.toLocaleDateString(LOCALE, {month:'short'}) + ' ' + dt.getFullYear())); } else d.append(el('b', '', '?'), el('small', '', '—'));
    if (hero && e.date){ const n = Math.round((localDate(e.date) - localDate(todayStr()))/86400000); info.append(el('span', 'count', n === 0 ? t('site.today') : n === 1 ? t('site.tomorrow') : t('site.inDays', {n}))); }
    info.append(el('h3', '', e.title || '—'));
    const when = e.date ? localDate(e.date).toLocaleDateString(LOCALE, {weekday:'long', day:'numeric', month:'long', year:'numeric'}) + (e.time ? ' · ' + e.time : '') : t('site.tbd');
    info.append(el('p', '', when));
    const where = [e.venue, e.address, e.city && e.cc ? e.city + ', ' + country(e.cc) : e.city].filter(Boolean).join(' · '); if (where) info.append(el('p', '', where));
    if (e.desc && (hero || !isPast(e))) info.append(el('p', 'desc', e.desc));
    if (hero && where){ const a = el('a', 'btn', t('site.openMap')); a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([e.venue, e.address, e.city].filter(Boolean).join(', ')); a.target = '_blank'; a.rel = 'noopener noreferrer'; info.append(a); }
    box.append(d, info); return box;
  }
  function render(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(x => { x.textContent = t(x.dataset.t); });
    document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
    drawCard();
    const evs = data ? data.events : [], up = evs.filter(e => !isPast(e)).sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999')), past = evs.filter(isPast).sort((a, b) => b.date.localeCompare(a.date));
    const nb = $('nextBox'); nb.textContent = ''; if (up.length) nb.append(evNode(up[0], true)); else nb.append(el('p', '', t('site.noEvents')));
    const fill = (sec, box, list) => { box.textContent = ''; list.forEach(e => box.append(evNode(e, false))); sec.hidden = !list.length; };
    fill($('upSec'), $('upList'), up.slice(1)); fill($('pastSec'), $('pastList'), past);
    const intro = data ? data.intro : ''; $('introText').textContent = intro; $('introSec').hidden = !intro;
    if (!data){ $('statSec').hidden = true; $('mapSec').hidden = true; return; }
    const st = $('stats'); st.textContent = '';
    for (const [n, k] of [[data.count, 'site.members'], [data.places.length, 'site.cities'], [new Set(data.places.map(p => p.c)).size, 'site.countries'], [past.length, 'site.eventsHeld']]){ const s = el('div', 'stat'); s.append(el('b', '', n), el('span', '', t(k))); st.append(s); }
    $('statSec').hidden = false;
    const pl = $('places'); pl.textContent = ''; data.places.forEach(p => { const tg = el('span', 'tag', p.n + ', ' + country(p.c)); tg.append(el('b', '', p.k)); pl.append(tg); }); $('fromH').hidden = !data.places.length;
    const hasMap = data.places.length || evs.some(e => e.la != null); $('mapSec').hidden = !hasMap;
    if (hasMap){
      if (!globe){ const f = up.find(e => e.la != null) || data.places[0] || evs.find(e => e.la != null); globe = new Globe($('globe'), f ? {lat:Math.max(-50, Math.min(60, f.la)), lon:f.lo} : {}); }
      globe.setData(data.places.map(p => ({lat:p.la, lon:p.lo, k:p.k, label:p.n + ', ' + country(p.c), sub:t('map.nMembers', {n:p.k})})),
        evs.filter(e => e.la != null).map(e => ({lat:e.la, lon:e.lo, past:isPast(e), label:e.title || '—', sub:(e.date ? localDate(e.date).toLocaleDateString(LOCALE, {day:'numeric', month:'short', year:'numeric'}) + ' · ' : '') + e.city})));
    }
  }
  document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { setLang(b.dataset.l); try{ localStorage.setItem('ctc-lang', LANG); }catch(e){} render(); });
  render();

  fetch('data.json?v=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || typeof j !== 'object') return;
    const num = v => Number.isFinite(+v) ? +v : null, okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';

    for (const p of (j.members && Array.isArray(j.members.places) ? j.members.places : []).slice(0, 500)){ if (p && typeof p.n === 'string' && /^[A-Z]{2}$/.test(p.c) && num(p.la) != null && num(p.lo) != null) data.places.push({n:p.n.slice(0,60), c:p.c, la:num(p.la), lo:num(p.lo), k:Math.max(1, parseInt(p.k, 10) || 1)}); }
    for (const e of (Array.isArray(j.events) ? j.events : []).slice(0, 300)){ if (!e || typeof e !== 'object') continue; const la = e.la == null ? null : num(e.la), lo = e.lo == null ? null : num(e.lo); data.events.push({title:str(e.title,70), date:okDate(e.date), time:/^\d{2}:\d{2}$/.test(e.time) ? e.time : '', venue:str(e.venue,70), address:str(e.address,120), city:str(e.city,60), cc:/^[A-Z]{2}$/.test(e.cc) ? e.cc : '', la:la != null && lo != null ? la : null, lo:la != null && lo != null ? lo : null, desc:str(e.desc,1200)}); }
    render();
  }).catch(() => {});
})();
</script>
